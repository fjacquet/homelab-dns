---
- name: Update all homelab nodes
  hosts: dns_servers:microcloud
  become: true
  serial: 1
  tags: [update]
  tasks:
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
        autoremove: true
        autoclean: true

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      changed_when: false

    # MicroCloud only: the LXD storage pool is a dir pool backed by the
    # Synology NFS mount /srv/datastore. A boot-time mount timeout (slow
    # NAS) leaves srv-datastore.mount "failed" and never retries, so
    # evacuate's precheck fails ("storage pools aren't started yet")
    # indefinitely. Ensure the mount is active first so evacuate can run.
    - name: Ensure NFS datastore mount is active before evacuate
      ansible.builtin.systemd:
        name: srv-datastore.mount
        state: started
      when:
        - inventory_hostname in groups['microcloud']
        - reboot_required.stat.exists
      tags: [update, reboot]

    - name: Evacuate LXD cluster member before reboot
      ansible.builtin.command: lxc cluster evacuate {{ mc_hostname }} --force
      register: lxc_evacuate
      changed_when: lxc_evacuate.rc == 0
      # apt's "upgrade: full" bounces snap.lxd.daemon; the LXD API can come
      # back a few seconds before the dir pool re-registers as "started".
      # A short retry absorbs that residual race (the NFS mount itself is
      # already guaranteed by the preceding task).
      until: lxc_evacuate.rc == 0
      retries: 6
      delay: 10
      when:
        - inventory_hostname in groups['microcloud']
        - reboot_required.stat.exists
      tags: [update, reboot]

    - name: Reboot if kernel was updated
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after package upgrade"
        connect_timeout: 5
        # MicroCloud nodes need a long window: snap + LXD daemon
        # initialization keeps sshd from binding for several minutes
        # after the kernel is up. 600s was too short and produced
        # spurious UNREACHABLE errors mid-rolling-upgrade.
        reboot_timeout: 1800
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: reboot_required.stat.exists
      tags: [update, reboot]

    - name: Verify Docker daemon is running
      ansible.builtin.systemd:
        name: docker
        state: started
      when: inventory_hostname in groups['dns_servers']

    # dns_servers: verify Technitium and Traefik are back

    - name: Verify Technitium is responding
      ansible.builtin.uri:
        url: "http://localhost:5380"
        status_code: 200
      register: technitium_check
      until: technitium_check.status == 200
      retries: 12
      delay: 10
      when: inventory_hostname in groups['dns_servers']

    - name: Verify Traefik API is responding
      ansible.builtin.uri:
        url: "http://localhost:8080/api/rawdata"
        status_code: 200
      register: traefik_check
      until: traefik_check.status == 200
      retries: 12
      delay: 10
      when: inventory_hostname in groups['dns_servers']

    # microcloud: verify LXD daemon + NFS, then restore cluster member
    - name: Verify LXD snap daemon is running
      ansible.builtin.systemd:
        name: snap.lxd.daemon
        state: started
      when: inventory_hostname in groups['microcloud']

    - name: Verify NFS datastore mount is active
      ansible.builtin.command: mountpoint /srv/datastore
      changed_when: false
      when: inventory_hostname in groups['microcloud']

    # systemd "started" only means the unit is active, not that the LXD
    # REST API is answering yet — right after a reboot it can still be
    # initializing, and firing `lxc cluster restore` too early gets the
    # command killed (rc -9) instead of failing cleanly.
    - name: Wait for LXD API to be ready
      ansible.builtin.command: lxc cluster list
      register: lxd_api_check
      until: lxd_api_check.rc == 0
      retries: 12
      delay: 10
      changed_when: false
      when:
        - inventory_hostname in groups['microcloud']
        - reboot_required.stat.exists
      tags: [update, reboot]

    - name: Restore LXD cluster member after reboot
      # --force skips the interactive (yes/no) confirmation; without it
      # the command reads stdin under ansible and exits "Error: EOF".
      ansible.builtin.command: lxc cluster restore {{ mc_hostname }} --force
      changed_when: true
      when:
        - inventory_hostname in groups['microcloud']
        - reboot_required.stat.exists
      tags: [update, reboot]
