---
# node_exporter is now an apt package (prometheus-node-exporter),
# updated automatically by update.yml (apt dist-upgrade).

- name: Update containers on dns_servers
  hosts: dns_servers
  become: true
  serial: 1
  tags: [update-containers]
  tasks:
    - name: Pull latest Technitium image
      community.docker.docker_compose_v2_pull:
        project_src: "{{ docker_base_dir }}/technitium"

    - name: Recreate Technitium container with new image
      community.docker.docker_compose_v2:
        project_src: "{{ docker_base_dir }}/technitium"
        recreate: always
        pull: never

    - name: Pull latest Traefik image
      community.docker.docker_compose_v2_pull:
        project_src: "{{ docker_base_dir }}/traefik"

    - name: Recreate Traefik container with new image
      community.docker.docker_compose_v2:
        project_src: "{{ docker_base_dir }}/traefik"
        recreate: always
        pull: never

    - name: Pull latest cAdvisor image
      community.docker.docker_image_pull:
        name: gcr.io/cadvisor/cadvisor
        tag: latest

    - name: Recreate cAdvisor container with new image
      community.docker.docker_container:
        name: cadvisor
        image: gcr.io/cadvisor/cadvisor:latest
        state: started
        recreate: true
        restart_policy: unless-stopped
        privileged: true
        volumes:
          - /:/rootfs:ro
          - /var/run:/var/run:ro
          - /sys:/sys:ro
          - /var/lib/docker/:/var/lib/docker:ro
        ports:
          - "{{ cadvisor_port }}:8080"

    - name: Verify Technitium is responding after update
      ansible.builtin.uri:
        url: "http://localhost:5380"
        status_code: 200
      register: technitium_check
      until: technitium_check.status == 200
      retries: 12
      delay: 10

    - name: Verify Traefik API is responding after update
      ansible.builtin.uri:
        url: "http://localhost:8080/api/rawdata"
        status_code: 200
      register: traefik_check
      until: traefik_check.status == 200
      retries: 12
      delay: 10

# Prometheus, Grafana, and Checkmk run as apt packages inside their LXD
# VMs (vm-monitoring, vm-checkmk) per ADR-017 — not Docker containers.
# They are patched by update-vms.yml (apt full-upgrade inside each VM),
# so there is no microcloud container-update play here.
